# Variante fuer den bestehenden nginx, falls kein Caddy zum Einsatz kommt.
# In den server-Block fuer www.ionas.com einsetzen.

root /var/www/ionas;
charset utf-8;

# /wissen bleibt WordPress (bestehende location-Bloecke unveraendert lassen!)

# /agb lieferte bisher downloads/AGB-ionas.pdf - hier mit korrektem Typ.
location = /agb {
    default_type application/pdf;
    alias /var/www/ionas/downloads/AGB-ionas.pdf;
}

location = /Datenschutz { return 301 /datenschutz; }

# ASCII-Schreibweisen der Umlaut-Landingpages
    rewrite ^/pc\-hilfe/duesseldorf$ /pc-hilfe/düsseldorf permanent;
    rewrite ^/pc\-hilfe/koeln$ /pc-hilfe/köln permanent;
    rewrite ^/pc\-hilfe/luebeck$ /pc-hilfe/lübeck permanent;
    rewrite ^/pc\-hilfe/moenchengladbach$ /pc-hilfe/mönchengladbach permanent;
    rewrite ^/pc\-hilfe/muelheim$ /pc-hilfe/mülheim permanent;
    rewrite ^/pc\-hilfe/muenchen$ /pc-hilfe/münchen permanent;
    rewrite ^/pc\-hilfe/muenster$ /pc-hilfe/münster permanent;
    rewrite ^/pc\-hilfe/nuernberg$ /pc-hilfe/nürnberg permanent;
    rewrite ^/pc\-hilfe/osnabrueck$ /pc-hilfe/osnabrück permanent;
    rewrite ^/pc\-hilfe/saarbruecken$ /pc-hilfe/saarbrücken permanent;
    rewrite ^/rescue\-stick$ /usb-stick permanent;

# Extensionslose URLs auf die Verzeichnis-Indizes
location / {
    try_files $uri $uri/index.html $uri/ =404;
}

error_page 404 /404.html;
location = /404.html { internal; }

location ~* ^/(static|images|ionas-neu|senderlogos)/ {
    expires 30d;
    add_header Cache-Control "public";
}
