            <p>Sie schreiben in dem Artikel:<br />
            &#8222;Wir haben uns für VMware Fusion entschieden, da VMware eine 30 Tage Probelizenz anbietet. Wenn man sich für den Kauf entscheidet, dann bietet VMware Fusion Pro für rund €200 brutto eine lebenslange Lizenz.&#8220;</p>
