datingplattform-lovoo-zockt-kunden-ab:
  - id: 141
    autor: "Michi"
    datum: "10. Oktober 2015 um 10:14 Uhr"
    html: |-
            <p>Guter Artikel. Hätte ich mich mal früher über die unseriösen Praktiken bei Lovoo informiert. Mit Ihren 4 Tipps zum Erkennen von Fake Profilen hätte ich wahrscheinlich nicht so viel Credits gekauft, um zu erfahren, wer mein Profil besucht hat.</p>
  - id: 326
    autor: "Peter"
    datum: "16. August 2016 um 21:02 Uhr"
    html: |-
            <p>Irgendwo habe ich in der Tagespresse gelesen, bei Lovoo sei die Staatsanwaltschaft eingefahren und hätte massenhaft Akten mitgenommen. Die App sei dann vom Netz gegangen. Verdacht: Betrug durch Fakeprofile. Ich kann das nicht verifizieren, aber Fakt ist, die betrügen fleissig weiter. Ich teste die App und die Webseite schon seit einigen Monaten. Neuerdings sind die Profile von Lovoo auch über die App VOO abrufbar. Die aktuelle Masche: Entweder steht im Profil des Fakes, das einen Like abgibt, eine Internetadresse, wo man diese Person &#8222;völlig gratis&#8220; kontaktieren könne. Oder man bekommt eine standartisierte Chatmeldung, die ebenfalls auf eine dieser Seiten locken soll. Das dritte sind Anfragen, bei denen man eine E-Mail Adresse angeben soll, damit man Bilder bekommt.<br />
            Eine echte, reale Person, die gemäss App im näheren Umkreis wohnen soll, habe ich noch nie gesehen.<br />
            Als Wohnort war bis vor einigen Wochen &#8222;Bramboden&#8220; sehr beliebt, nota bene ein 60 Seelendorf in der Schweiz. Und da sollten also einige hundert Lovoo-interessierte Frauen wohnen? Aktuell wohnt die halbe Lovoo-Gemeinde in Vaduz, Mauren, Nendeln, wieder alles kleine Orte, wo sich fast jeder kennt und wohl kaum 180 % (weil mehr Lovoomitglieder als Einwohner der Orte) der weiblichen Einwohnerschaft auf Lovoo aktiv ist, unterstellt man mal, dass dort nur jüngere und flirtwillige Frauen leben.<br />
            Man sieht also, die Betreiber von Lovoo haben trotz der Untersuchung der Staatsanwaltschaft nicht aufgehört, weiter flirtwillige zu betrügen. Zu gross muss wohl der finanzielle Anreiz sein. Es wäre vielleicht wieder mal schön, wenn man solche Machenschaften, nicht nur bei Lovoo, als Thema für eine Recherche benutzen würde. Ich glaube, es werden nach wie vor tausende Männer betrogen und abgezockt!</p>
