            <p>Guten Tag<br />
             Nach vielen Minuten des Wartens auf der Hotline &#8211; kostest ja nur einige Euro jede Minute, entsteht bei mir der Verdacht, dass man so gutes Geld mit Free-Emails macht. Ist eine absolute Frechheit. Zumindest sollte nach über 6 Minuten in der Warteschleife mal jemand ans Telefon kommen oder es sollte erst bei einem Gespräch verrechnet werden. Dies sind schon dubiose Machenschaften, welche GMX hier offenbar missbraucht. </p>
            <p>Ich muss im Outlook immer das Passwort eingeben und es wird nicht verifiziert &#8211; WARUM. </p>
            <p>Gruss<br />
            Martin Herzog<br />
            Ein unzufriedener neuer Kunde &#8211; Kundenschulung erste Stunde wäre hilfreich.</p>
  - id: 2534
    autor: "Ralf Dyllick-Brenzinger"
    datum: "17. April 2018 um 10:39 Uhr"
    html: |-
            <p>Sehr geehrter Herr Herzog,</p>
            <p>es tut mir leid, dass Sie mit Ihrem GMX Konto Probleme haben.</p>
            <p>Erlauben Sie mir zu Beginn darauf hinzuweisen, dass meine Firma ionas &#8211; Ihr Online Assistent nicht mit GMX verbunden ist. Wir sind ein selbständiges PC-Support Unternehmen. Bei uns können Sie auch anrufen, um Hilfe zu bekommen. Bei uns kostet die Warteschleife nichts und wenn Sie nach 3Minuten nicht einen Ansprechpartner dran haben, rufen wir auch gerne zurück. Wenn Sie mit meiner Hilfe unten nicht weiterkommen, können Sie es ja bei uns probieren.</p>
            <p>Nun zu Ihrer Frage &#8222;Warum?&#8220;: Wenn Ihr Passwort in Outlook nicht gespeichert wird, dann vermute ich ein Problem mit dem Outlook Profil. Es wäre ein Versuch wert, ein neues Outlook Profil anzulegen und in diesem Ihr Outlook Konto einzurichten. Das ist eine Sache von 5 Minuten und wenn es funktioniert, dann haben Sie die Ursache des Problems identifiziert und gleichzeitig das Problem gelöst.</p>
            <p>Wie Sie in Outlook ein neues Konto anlegen, wird hier gut erklärt: <a href="https://support.office.com/de-de/article/erstellen-eines-outlook-profils-f544c1ba-3352-4b3b-be0b-8d42a540459d" rel="nofollow ugc">https://support.office.com/de-de/article/erstellen-eines-outlook-profils-f544c1ba-3352-4b3b-be0b-8d42a540459d</a></p>
            <p>Beste Grüße<br />
            Ralf Dyllick</p>
