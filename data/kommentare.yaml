            <p>Bin mit der Suchfrage: „Kann man mehrfach angelegte gmx-E-Mail-Adressen mit Outlook auswählen“ hier gelandet.  Die Erklärung für eine Adresse ist gut, beantwortet aber leider nicht mein Anliegen. Kann man nur mit  Firefox  unter Einstellung  die Adresse auswählen?</p>
