            bitte rufe uns an, damit wir uns das Problem per TeamViewer ansehen können. Ich bin mir sicher, dass wir deine INBOX wiederfinden, da IMAP eigentlich nicht selbstständig irgendwelche Ordner löscht oder verschwinden lässt.<br />
