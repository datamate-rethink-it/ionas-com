            <p>Sehr geehrter Herr Herrmann,</p>
            <p>vielen Dank für Ihre netten Worte! Ich als Autor des Artikels freue mich besonders über die anerkennenden Worte!</p>
            <p>Kurzfristig werde ich den Artikel leider nicht überarbeiten können. Sie können sich sicher vorstellen, dass die Recherche zu solch einem Artikel durchaus beachtlich ist und das Verfassen der Artikel ist für uns reines &#8222;Privatvergnügen&#8220;. Die Arbeit an Kundenprojekten geht bei uns vor.</p>
            <p>Eigentlich müsste der Artikel alle 3 Monate überarbeitet werden, denn die Entwickler ändern mit Versionswechseln die angebotenen Funktionen bzw. verschieben Funktionen von der kostenlosen in die kostenpflichtige Version und zurück. Ein heute geschriebener Artikel kann wenige Wochen später schon falsch sein.</p>
            <p>Wenn es zu einer Überarbeitung kommt &#8211; wohl in der zweiten Jahreshälfte &#8211; dann werde ich mich an Ihre Kommentare erinnern! </p>
            <p>Mit freundlichen Grüßen!</p>
