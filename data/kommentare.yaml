    datum: "11. November 2017 um 14:14 Uhr"
    html: |-
            <p>Guten Tag,</p>
            <p>ich ziehe in Erwägung euren Tipp: VMware mit Bootcamp einzurichten.<br />
            Eine generelle Frage bleibt mir aber weiterhin offen: Sollte man sich, wenn man eine Windowspartition auf seinem Mac installiert, ebenfalls einen Virenscanner installieren bzw. wird der benötigt?</p>
            <p>Ansonsten vielen Dank für den Beitrag!</p>
            <p>beste Grüße</p>
  - id: 1922
    autor: "Ralf Dyllick-Brenzinger"
    datum: "11. November 2017 um 16:52 Uhr"
    html: |-
            <p>Hallo!</p>
            <p>grundsätzlich gilt: Windows in einer Virtuellen Maschine kann genauso von Schadsoftware heimgesucht werden wie ein lokal installiertes Windows. Wer sein System schützen will, der sollte ein Antivirenprogramm installieren.</p>
            <p>Das ist insbesondere dann wichtig, wenn das Windows mit Netzlaufwerken kommuniziert. Diese können nämlich auch infiziert bzw. von Crypto-Trojanern verschlüsselt werden.</p>
            <p>Das macOS auf dem Apple Rechner ist bei einer Vireninfektion des virtualisieren Windows aber nicht unmittelbar in Gefahr. Es gibt nur sehr wenige Schadprogramme gibt, die Betriebssystemgrenzen überspringen können.</p>
            <p>Grüße<br />
            Ralf Dyllick</p>
