beihilfe-zum-betrug-kauf-von-internet-bewertungen:
  - id: 3384
    autor: "Vivien"
    datum: "1. Oktober 2018 um 09:04 Uhr"
    html: |-
            <p>Ein guter Beitrag, der so manchen zum Nachdenken helfen sollte.<br />
            Aber die andere Seite der Bewertungen von &#8222;echten&#8220; Kunden, die bewusst negative 1-Sterne-Bewertungen schreiben, obwohl sie trotz guter Produkte und Services nicht zufrieden zu stellen sind, auch noch Preisreduzierungen verlangen, sollte ebenso erwähnt werden. Das &#8222;Eins-Auswischen&#8220;, was viele Bewerter betreiben ist gleichermaßen unschön, auch wenn es evtl. durch freie Meinungsäußerung gedeckt ist.<br />
            Dies sollte in einem solchen Artikel ebenfalls vermerkt werden.</p>
  - id: 3385
    autor: "Ralf Dyllick-Brenzinger"
    datum: "1. Oktober 2018 um 09:21 Uhr"
    html: |-
            <p>Liebe Vivien,</p>
            <p>welcher Laden oder Online Business Besitzer kennt das nicht: Es läuft mal was nicht rund und schon droht ein Kunde (oder sogar nur ein Interessent) mit einer negativen Bewertung. Wegen ein Nichtigkeit! Davon kann ich und zahlreiche andere Unternehmer ein Lied singen. Du sprichst damit also einen validen Punkt an.</p>
            <p>Andererseits ist das keine rechtliches Vergehen! Wenn ein Kunde sich ungerecht behandelt fühlt &#8211; zu unrecht oder nicht &#8211; dann ist es sein Recht, diesen Unmut zu äußern. Eine negative Kritik, die nicht eine Verleumdung oder Erpressung ist, muss man sich gefallen lassen.</p>
