            <p>Sehr geehrter Herr Tank,<br />
            ich bin mir ziemlich sicher, dass Sie in den Einstellungen von GMX nicht den E-Mail Abruf mit E-Mail Clients genehmigt haben. Schauen Sie sich in <a href="https://www.ionas.com/wissen/web-de-outlook-2013-einrichtung-eines-e-mail-kontos-leicht-gemacht/">dieser Anleitung</a> bitte den Schritt 1 an. (Lassen Sie sich bitte nicht von der Tatsache irritieren, dass es sich um eine Anleitung für Web.de handelt, das Vorgehen ist bei GMX identisch mit dem Vorgehen zu Web.de).<br />
            Wenn das Ihr Problem nicht gelöst hat, dann rufen Sie doch bitte einmal an: 06131 327070. Ich schaue mir gerne das Problem mal direkt per Fernwartung an.<br />
            Mit freundlichen Grüßen<br />
            Ralf Dyllick</p>
  - id: 1938
