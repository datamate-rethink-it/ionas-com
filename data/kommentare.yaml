outlook-umziehen:
  - id: 1368
    autor: "Matthias"
    datum: "3. Mai 2017 um 17:57 Uhr"
    html: |-
            <p>Sehr schöne Erklärung. Hier werden auch die Zusammenhänge und der Sinn der unterschiedlichen Dateiformate gut erklärt.</p>
            <p>Frage: </p>
            <p>Funktioniert der Spaß den auch für vorgefertigte und angelegte Textbausteine?<br />
            Funktioniert dies auch für bereit erstellte E-Mail Signaturen?</p>
            <p>Grüße</p>
  - id: 1369
    autor: "ionas - Ihr Online Assistent"
    datum: "3. Mai 2017 um 21:08 Uhr"
    html: |-
            <p>Die Frage ist sehr berechtigt! Hier die Antworten:</p>
            <p>Signaturen werden grundsätzlich nicht in PST-Dateien gespeichert, sondern in separaten Signaturdateien. Diese heissen, jenachdem welches Signaturformat Sie verwenden, signatur.htm, Signatur.rtf oder Signatur.txt, wobei &#8222;Signatur&#8220; für den Namen der Signatur steht, wie Sie ihn in Outlook vergeben haben.</p>
            <p>Textbausteine werden in der normal.dot gespeichert.</p>
            <p>Weitere Informationen finden Sie unter diesem KB-Eintrag von Microsoft: <a href="https://support.microsoft.com/de-de/help/287070/how-to-manage-.pst-files-in-microsoft-outlook" rel="nofollow ugc">https://support.microsoft.com/de-de/help/287070/how-to-manage-.pst-files-in-microsoft-outlook</a></p>
            <p>Tatsächlich lohnt es sich also, sich vor einem Outlook Umzug zu überlegen, ob die Datendateien alleine ausreichen, um Outlook am neuen Rechner genau so zu nutzen wie an dem alten.</p>
  - id: 1560
    autor: "Sabine"
    datum: "10. Juli 2017 um 14:39 Uhr"
