            <p>Hallo Michael,<br />
            ich vermute, Sie verwenden Windows 10. In den letzten Tagen erreichen uns nämlich vermehrt Anrufe von GMX-Usern, die ihre E-Mail Konten nicht mehr mit Outlook unter Windows 10 abrufen können. Aktuell ist uns keine Lösung für dieses Outlook+GMX Problem bekannt, werden aber weiter recherchieren. Als Übergangslösung können wir momentan nur andere E-Mailclients wie Thunderbird oder eM-Client oder eben die Webseite von GMX empfehlen. Wir halten Sie aber auf dem Laufenden.</p>
