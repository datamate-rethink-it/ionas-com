  - id: 522
    autor: "Christoph Dyllick-Brenzinger"
    datum: "12. Oktober 2016 um 06:09 Uhr"
    html: |-
            <p>Hallo Mikasa,<br />
            ich vermute auf dem alten Laptop werden die E-Mails noch mit dem POP3-Protokoll abgerufen. POP3 lädt im Gegensatz zu IMAP die E-Mails vom Server auf den Computer herunter und löscht die Kopien auf dem Server. IMAP hingegen belässt die E-Mails auf dem Server, so dass man auch mit mehreren Geräten (Notebook, Smartphone, Tablet etc) auf die gleichen Mails zugreifen kann.<br />
            Um Mails auf deinen neuen Laptop zu kriegen, muss im alten Laptop der E-Mailabruf (d.h. das Konto) deaktiviert werden. Gerne helfen wir dir dabei per TeamViewer-Fernwartung. Ruf uns einfach an.<br />
            Viele Grüße</p>
