            <p>Guten Tag, ich benutze schon viele Jahre Microsoft outlook 2016. Habe dort auch meine gmx-Mail-Adressen 2 Stck.. Nun habe ich mir eine neue eMail-Adresse auf gmx.ch besorgt. Funktioniert auch. Nun wollte ich die neue Adresse auf outlook einrichten. Habe alles genau wirklich genau eingegeben. Doch es kommt immer das Feld nach dem Test &#8222;Geben sie ihren Benutzernamen und ihr Kennwort für folgenden Server ein&#8220;. Das habe ich und es stimmt auch wirklich. Habe das nun schon zum 100. mal gemacht kein Erfolg. Habe noch nie ein Problem gehabt.<br />
            Was kann ich noch tun ?<br />
