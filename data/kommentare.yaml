            <p>Lieber Uwe, habe nach Heirat meinen Nachnamen geändert. Habe die Namensänderung in GMX nach Anleitung erfolgreich durchgeführt. Versende ich Emails aus GMX wird der korrekte Nachname angezeigt beim Empfänger. Versende ich Emails aus Outlook wird der alte Nachname als Absender angezeigt. Wie kann ich das ändern? Danke und Gruß, Tanja</p>
