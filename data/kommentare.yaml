            <p>Super Artikel &#8211; hat mir sehr geholfen &#8211; Danke!</p>
            <p>Eine Frage hab ich noch: Wie verhält es sich, wenn während des ersten Sicherungslaufs der PC in den Ruhezustand versetzt wird, läuft das einfach normal weiter wenn der PC wieder online ist oder können hier Probleme auftreten?<br />
            Bei einer großen Menge an Daten wird das nicht an einem Arbeitstag erledigt sein.</p>
            <p>Vielen Dank<br />
            Tom</p>
  - id: 437
    autor: "Ralf Dyllick-Brenzinger"
    datum: "23. September 2016 um 14:03 Uhr"
    html: |-
            <p>Hallo Tom,</p>
            <p>freut uns, wenn Dir der Artikel hilft.</p>
            <p>Bezüglich Deiner Frage: Klar, bei einer Festplatte im Terabyte-Bereich, die auch nur annähernd gut gefüllt ist, dauert die Datensicherung auch bei einer schnellen Verbindung zur externen Festplatte oder dem Netzlaufwerk eine ganze Weile. Wenn sich während der Sicherung der Computer in den Ruhemodus begibt oder auch ausgeschaltet wird, dann wir die Sicherung nach dem erneuten Hochfahren wieder aufgenommen. Vielleicht nicht unmittelbar, aber die Sicherung läuft automatisch nach einiger Zeit wieder an. Das kannst du gut prüfen, indem Du einfach den Gesamtumfang der gesicherten Dateien überprüfst. Und der sollte wachsen.</p>
