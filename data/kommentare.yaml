    autor: "Ralf Dyllick-Brenzinger"
    datum: "10. November 2017 um 11:10 Uhr"
    html: |-
            <p>Sehr geehrter Herr Ohro,<br />
            Cortana ist so tief im System verankert, dass es nicht mit einfachen Mitteln möglich ist, Cortana sicher und zuverlässig vom System zu entfernen.<br />
            Wenn Sie Cortana nur deaktivieren, dann bleibt es im Task-Manager. Steht auch so im Beitrag: &#8222;Leider bleiben die Prozesse von Cortana, auch wenn man es deaktiviert hat, im Task-Manager bestehen. Die Abbildung rechts zeigt die Cortana Prozesse auf einem Windows 10 Home-System mit deaktiviertem Sprachassistenten Cortana. Eine hohe Belastung stellen sie nicht für CPU und Arbeitsspeicher dar, andererseits ist für einen ungewünschten Dienst auch wenig zuviel.&#8220;<br />
            Um Cortana auch aus dem Task-Manager zu verbannen, müssen Sie die Deinstallation durchführen. Wie dies geht, steht am Ende des Artikels.<br />
            Grüße,<br />
            Ralf Dyllick</p>
