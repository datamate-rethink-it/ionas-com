            <p>Ich finde es toll, dass Ihr euch so für eure Kundenwünsche einsetzt und die Lösungen auch veröffentlicht!<br />
            Mir fehlt in dem Beitrag allerdings ein Hinweis darauf, dass es sich bei diesem Doppel-Bindestrich nicht um eine schräge Thunderbird-Eigenheit handelt, die Nutzer übersehen oder ignorieren, sondern um ein weithin gebräuchliches Trennzeichen, das es E-Mail-Clients ermöglicht, die Signatur z.B. in Antworten abzutrennen und dadurch die Lesbarkeit des Nachrichtenverlaufs deutlich zu verbessern. Das ist insbesondere von großem Vorteil, wenn der Absender HTML-Mails versendet, der Empfänger aber mit einer Text-Mail antwortet. Siehe dazu <a href="https://en.wikipedia.org/wiki/Signature_block#Signatures_in_Usenet_postings" rel="nofollow ugc">https://en.wikipedia.org/wiki/Signature_block#Signatures_in_Usenet_postings</a>, <a href="https://tools.ietf.org/html/rfc3676#page-9" rel="nofollow ugc">https://tools.ietf.org/html/rfc3676#page-9</a> und <a href="https://www.karelbemelmans.com/2015/05/netiquette-email-signature-separator/" rel="nofollow ugc">https://www.karelbemelmans.com/2015/05/netiquette-email-signature-separator/</a>.<br />
            Beste Grüße aus Berlin!</p>
