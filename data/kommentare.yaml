  - id: 701
    autor: "Kai Diekmann"
    datum: "25. Januar 2017 um 01:20 Uhr"
    html: |-
            <p>Ich bin seit fast 20 Jahren der Besitzer der Adresse [E-Mail-Adresse entfernt]. Unter meinem Namen wurden heute &#8222;Bewerbungsmails&#8220; mit viren verschickt. Diese Mails stammen nicht von mir, ich wurde , soweit ich das feststellen kann, auch nicht gehackt. Es handelt sich hier um einen Identitätsdiebstahl bzw. Verwendung der Lücken im SMTP-PROTOKOLL. Nach den Rückmeldungen zu urteilen haben alleine am 24.01.17 über 6500 Personen die Mails geöffnet, die meisten aber mit Virenscannern. An ABUSE der Telekom habe ich mich schon gewandt , ich werde jetzt noch versuchen eine Strafanzeigen zu stellen.</p>
  - id: 705
    autor: "Ralf Dyllick-Brenzinger"
    datum: "25. Januar 2017 um 07:13 Uhr"
    html: |-
            <p>Sehr geehrter Herr Diekmann,</p>
            <p>Spam-Mail und diese Fake-Bewerbungs-E-Mails sind leider die Geissel des digitalen Zeitalters. Man kann nur Symptombehandlung machen, d.h. Spam-Mails löschen bzw. nicht beachten. An die Ursachen &#8211; die hohe finanzielle Attraktivität des Spamming &#8211; kommt man leider nicht ran.</p>
            <p>Es ist tatsächlich so, dass sich der Absender einer E-Mail recht leicht fälschen lässt. Dazu muss man kein ausgewiesener IT-Experte sein. Das &#8222;Wie&#8220; lässt sich recht einfach im Internet nachlesen bzw. die passende Spamming-Software im Internet kaufen.</p>
            <p>Es ist also durchaus so, dass über Ihre E-Mail-Adresse fröhlich gespammt werden kann, auch wenn die Spammer keine Kontrolle über Ihr Konto haben. Mir selbst ist es schon passiert, dass ich Spam-Mail mit meiner eigenen E-Mail-Adresse im Postfach hatte.</p>
            <p>Eine Strafanzeige zu stellen, ist formal gesehen, der richtige Schritt. Leider habe ich keine große Hoffnungen der Aufklärung.</p>
            <p>Mit freundlichen Grüßen, ionas &#8211; Ihr Online Assistent</p>
