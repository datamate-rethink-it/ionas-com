            <p>Bei mir öffneten sich ebenfalls aus Outlook heraus die Links nicht mehr im FF-Browser. Statt dessen poppte der Ordner &#8222;Eigene Dateien&#8220; auf. Durch den Hinweis von Brigtte (vielen Dank!) fand ich die Ursache: FF war nicht mehr als Standard-Browser eingestellt. Hintergrund: Beim Update von CC-Cleaner wurde frivolerweise der Browser CHROME installiert. Er etablierte sich auch gleich als Standard. Nachdem die Datenkrake CHROME für mich nicht infrage kommt, habe ich ihn sogleich wieder deinstalliert. Dass FF nun nicht mehr der St.-Browser war, fiel mir aber erst jetzt auf. Nach Festlegung von FF als Standardbrowser funktionieren auch die Links aus Outlook heraus wieder. Bei meinem Problem brauchte es also die FIX-it-Datei nicht, und der Grund scheint auch nicht in einem MS-Update zu liegen.<br />
