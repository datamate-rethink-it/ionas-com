            <p>Ihre Frage können wir leider nicht mit letzter Gewissheit beantworten. Wir trauen uns aber ein &#8222;wohl eher nicht&#8220; zu.</p>
            <p>Mit Sicherheit lässt sich keine Aussage treffen, da nicht klar ist, welche Software der Trojaner nachlädt, sobald er ausgeführt wird. Je nachdem was der Trojaner nachlädt, kann die Schadsoftware auch Macs befallen. Da es aber nur sehr wenige Schadsoftware für Macs gibt, ist dies eher unwahrscheinlich. So kommt das &#8222;wohl eher nicht&#8220; zustande.</p>
            <p>Wenn auf Ihrem Rechner keine Daten verschlüsselt wurden, dann haben Sie wohl Glück gehabt. Gerade heute morgen rief uns ein Geschädigter an, dessen Daten nach dem Öffnen verschlüsselt wurden.</p>
