web-de-thunderbird-e-mail-konto-einrichtungsanleitung:
  - id: 760
    autor: "Thomas Klöber"
    datum: "6. Februar 2017 um 18:22 Uhr"
    html: |-
            <p>Hallo Zusammen,<br />
            vielen Dank für eure hilfreichen Tipps!<br />
            Ich habe noch ein Problem im Zusammenhang mit Thunderbird und Web.de.<br />
            Ich habe alle Einstellungen wie beschrieben vorgenommen und der Zugriff über POP3 funktioniert auch (fast). Laut Web.de wird standard-mässig der Ordner &#8222;Freunde und Bekannte&#8220; von Thunderbird abgerufen siehe <a href="https://hilfe.web.de/email/einstellungen/pop3-einstellungen.html" rel="nofollow ugc">https://hilfe.web.de/email/einstellungen/pop3-einstellungen.html</a>). Man könne aber auch für jeden Ordner die Einstellung ändern. Nur wo und wie kann ich leider nicht finden.<br />
            Habt ihr das rausgefunden?</p>
            <p>Vielen Dank!<br />
            Thomas Klöber</p>
  - id: 762
    autor: "Ralf Dyllick-Brenzinger"
    datum: "6. Februar 2017 um 23:00 Uhr"
    html: |-
            <p>Sehr geehrter Herr Klöber,</p>
            <p>danke für Ihr Interesse an unserem Blog und Ihren anerkennenden Worten.</p>
            <p>In den Ordnereinstellungen in der WEB.DE E-Mail-Oberfläche lässt sich einstellen, welche Ordner beim Abruf per POP3 heruntergeladen werden. Per Setzen bzw. Entfernen des Häkchens können Sie für jeden einzelnen Ordner auswählen, ob der in Thunderbird heruntergeladen werden soll oder nicht.</p>
            <p>Ebenfalls können Sie Ordner-für-Ordner festlegen, ob Sie über den Status des Ordner in einer E-Mail auf dem laufenden gehalten werden. WEB.DE nennt das den POP3 Report. Das machen Sie im selben Menü. Einfach Klick auf das Werkzeug Symbol hinter dem jeweiligen Ordner.</p>
            <p>Ich empfehle Ihnen aber grundsätzlich den Abruf Ihrer E-Mails per IMAP. IMAP ist das modernere und leistungsfähigere Protokoll. Mit ihm können Sie alle Ihre E-Mail auf unterschiedlichen Geräten synchron halten. Bei WEB.DE haben auch Freemail Kunden die Möglichkeit auf ihre E-Mails per IMAP zuzugreifen.</p>
            <p>Mit freundlichen Grüßen<br />
            ionas &#8211; Ihr Online Assistent</p>
