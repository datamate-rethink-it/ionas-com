    datum: "10. November 2017 um 11:11 Uhr"
    html: |-
            <p>Sehr geehrter Herr/Frau Stark,<br />
            vielen Dank für Ihre Anfrage.<br />
            Ich gehe davon aus, dass Sie eine PST &#8211; Datei umgezogen haben. In dem Fall müssen Sie die E-Mail-Adresse neu einrichten. Die E-Mail-Konfiguration ist nämlich nicht in den PST-Einstellungen abgespeichert.<br />
            Wenn Sie das neue Konto eingerichtet haben, dann legt Outlook auch eine neue Datendatei an. Bei dieser Einstellung können Sie es lassen. Sie haben dann aber zwei Datendateien. Die alte Datendatei mit den alten E-Mail und eine neue mit den neu eintreffenden E-Mails.<br />
            Wenn Sie diese Dualität nicht wollen, dann müssen Sie Outlook so konfigurieren, dass neue E-Mails in die alte Datendatei gelegt werden. Das machen Sie über die Kontoeinstellungen. Klicken Sie auf das E-Mail Konto drauf und ändern Sie im unteren Bereich den Speicherort für die E-Mails.<br />
            Beste Grüße,<br />
            Ralf Dyllick</p>
