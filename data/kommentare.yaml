            <p>Vielen Dank für die Erklärung. Ich habe alles gemacht und mich vor allem über den Satz &#8222;Das gleiche gilt für neue Ordner, die in Outlook über das Kontextmenü der Ordner erstellt werden. Diese werden automatisch in der Webansicht des GMX-Postfachs angelegt und danach synchron gehalten&#8220; gefreut.<br />
            Doch leider funktioniert genau das bei mir nicht. Die Ordner, die ich in Outlook 2016 erstelle, werden mit dem Zusatz &#8222;Nur dieser Computer&#8220; erstellt und nicht mit dem GMX-Konto und meiner Mail-App synchronisiert. Was muss ich diesbzgl. umstellen? Bin gerade am Verzweifeln :-(&#8230;</p>
  - id: 1491
    autor: "Ralf Dyllick-Brenzinger"
    datum: "5. Juni 2017 um 11:40 Uhr"
    html: |-
            <p>Hallo Tanja!</p>
            <p>Hier gilt der IT-Konjunktiv: Wenn Du es so gemacht hast, wie in der Anleitung beschrieben, dann müsste es eigentlich funktionieren. Ich habe es soeben nochmal an meinem eigenen Rechner nachgestellt.</p>
            <p>Zwei Punkte muss ich aber noch erwähnen:<br />
            1.) Bitte prüfe, ob Du Dein Konto wirklich als IMAP Konto eingerichtet hast. Die Ordnersynchronisation funktioniert nämlich nur unter IMAP. Falls Du irrtümlicherweise POP3 verwendet hast, wird es nicht klappen.<br />
            2.) Wir haben die Erfahrung gemacht, dass manchmal eine zu hohe Ordneranzahl die Synchronisation behindert. Bitte reduziere Deine Ordneranzahl und probiere es dann erneut.</p>
            <p>Ich bin guter Dinge, dass einer der beiden Punkte Dein Problem löst.</p>
            <p>Grüsse<br />
            ionas</p>
