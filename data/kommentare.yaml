  - id: 843
    autor: "Helmut"
    datum: "3. März 2017 um 17:39 Uhr"
    html: |-
            <p>Es gibt ja weltweit gültige Vereinbarungen, wie eine Email technisch auszusehen hat. Dies wird u.a. in sogenannten &#8222;Request For Comments&#8220; festgelegt, z.b welche Headerzeilen eine Email haben muss. Hier wurde auch festgelegt, dass ein Signaturtrenner aus zwei Bindestrichen plus ein Leerzeichen bestehen muss. </p>
            <p>&#8222;Early difficulties in inferring return addresses from article headers led to &#8222;signatures&#8220;: short closing texts, automatically added to the end of articles by posting agents, identifying the poster and giving his network addresses etc. If a poster or posting agent does append a signature to an article, the signature SHOULD be preceded with a delimiter line containing (only) two hyphens (ASCII 45) followed by one blank (ASCII 32). Posting agents SHOULD limit the length of signatures, since verbose excess bordering on abuse is common if no restraint is imposed; 4 lines is a common limit.&#8220;</p>
            <p>Damit können Email Reader so umgehen, dass sie die Signatur grundsätzlich ausblenden können, wenn es gewünscht wird. Ist dieser Signaturtrenner nicht oder falsch (nur zwei Bindestriche ohne Leerzeichen) angelegt, kann die Funktion des Ausblendens der Signatur nicht genutzt werden. Also bitte: nicht löschen, er gehört zur Vereinbarung, wie Emails technisch gesehen formatiert werden müssen.</p>
