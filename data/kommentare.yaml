  - id: 1609
    autor: "Ralf Dyllick-Brenzinger"
    datum: "6. August 2017 um 14:16 Uhr"
    html: |-
            <p>Sehr geehrter Herr Stromeier,</p>
            <p>wir haben in der Tat zwei Vorschläge.  Vorschlag 1: Wechseln Sie das E-Mail-Programm; Vorschlag 2: Wechseln Sie den E-Mail Anbieter.</p>
            <p>Was flappsig klingt, ist sehr ernst gemeint. Lassen Sie uns das darstellen.</p>
            <p>Windows Live Mail ist ein E-Mail Programm aus der Windows 7 Zeit. Es ist nicht mehr zeitgemäss. Der Support von Microsoft ist auch schon eingestellt worden wie Sie z.B. <a href="http://www.computerbild.de/artikel/cb-News-Windows-Microsoft-Windows-Live-Essentials-Alternativen-16531409.html" rel="nofollow">in diesem Bericht</a> nachlesen könnenh. Wenn sich Probleme mit dem Programm häufen, dann ist das nicht verwunderlich.</p>
            <p>Wir wissen aus unterschiedlichen Kundengesprächen, dass Arcor in den letzten Monaten offensichtlich immer mal wieder Probleme mit seinen Mail-Server hatte. In einem jüngsten Fall haben wir eine halbe Stunde mit einer Kundin Ursachenforschung betrieben und dann festgestellt, dass es nichts festzustellen gab. Die E-Mails gingen trotzdem nicht raus. 3h später rief die Kundin erneut an und berichtete, dass sie nun wieder E-Mails verschicken könne.</p>
            <p>Woran Ihre konkreten Probleme nun liegen &#8211; ob an Windows Live Mail oder Arcor &#8211; können wir aus der Entfernung nicht sagen. Wir schlagen vor, einen Wechsel des E-Mail Programms auf jeden Fall in Betracht zu ziehen. Das ist ja auch vergleichsweise einfach. Unsere Empfehlung: Mozilla Thunderbird oder <a href="http://de.emclient.com/" rel="nofollow">eM Client</a>. Wenn Sie Office haben, dann würde sich auch Outlook anbieten.  Der Wechsel des E-Mail Anbieters ist mit gewissen Unannehmlichkeiten verbunden. Das ist uns klar. Andererseits können Sie diese minimieren, indem Sie nach Einrichtung einer neuen E-Mail-Adresse bei einem Alternativanbieter &#8211; hier eine <a href="https://www.ionas.com/wissen/e-mailanbieter-im-vergleichstest/">Auswahl</a> &#8211; einfach eine globale Weiterleitung Ihrer Arcor E-Mail-Adresse auf diese neue Adresse anlegen. Dann werden alle E-Mails an Ihre Arcor Adresse kopiert und an Ihre neue E-Mail-Adresse weitergeleitet. Sie brauchen dann nur ein Postfach abrufen und laufen nicht Gefahr, dass E-Mails verloren gehen.</p>
            <p>Selbstverständlichen helfen wir Ihnen gerne bei diesen Maßnahmen, wenn Sie Hilfe brauchen. Sie erreichen uns an 7 Tagen die Woche unter 06131 327070.</p>
            <p>Mit freundlichen Grüßen<br />
            ionas &#8211; Ihr Online Assistent</p>
