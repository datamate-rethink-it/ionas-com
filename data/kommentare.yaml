            <p>Hallo, super Artikel. Mich würde aber noch interessieren wie es mit der Sicherheit aussieht? Welcher Reader hat die wenigsten Sicherheitslücken?</p>
  - id: 763
    autor: "Ralf Dyllick-Brenzinger"
    datum: "6. Februar 2017 um 23:09 Uhr"
    html: |-
            <p>Hallo Tbecky,</p>
            <p>freut mich (ich bin der Autor des Artikels) wenn der Artikel gefällt.</p>
            <p>Der von Dir angesprochene Aspekt ist ein wichtiger &#8211; und relevanter. Ich würde die Frage tatsächlich noch etwas anders formulieren: Welcher PDF Viewer ist der sicherste? Diese Frage beleuchtet nämlich nicht nur die Sicherheitslücken, sondern auch das Risiko, dass diese Lücken ausgenutzt werden. Denn eine Sicherheitslücke groß wie ein Scheunentor ist keine Gefahr, wenn niemand diese findet &#8211; geschweige denn ausnutzt.</p>
            <p>Diese Analyse übersteigt aber bei weitem unsere Möglichkeiten. Wir sind keine auf IT-Sicherheit spezialisierte Firma und haben daher die notwendigen Ressourcen nicht. Aber selbst wenn wir die Ressourcen hätten, eine solche Analyse würde Tage, wenn nicht Wochen dauern. Nicht umsonst tauchen Sicherheitslücken erst mit der Zeit auf.</p>
            <p>Ganz grundsätzlich ist das Sicherheitsrisiko mit dem Standard PDF-Betrachter Adobe Reader wohl am größten. Nicht weil dieser zwangsläufig am meisten Lücken aufweisst, sondern weil es sich beim dem lohnt, auf Lückensuche zu gehen. Der Reader ist gefühlt auf jedem Rechner dieser Welt installiert, somit jeder Rechner ein potenzielles Ziel. Ist also ein wenig wie beim Mac: Der Mac ist nicht per se unverwundbar, aber es gibt viel weniger Cyber Kriminelle, die es auf den Mac abgesehen haben.</p>
            <p>Viele Grüße<br />
            ionas &#8211; Ihr Online Assistent</p>
