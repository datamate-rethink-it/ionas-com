windows-7-sp2-unerwarteter-segen-fuer-windows-7-neuinstallationen:
  - id: 368
    autor: "Reinhard Hofmann"
    datum: "1. September 2016 um 09:45 Uhr"
    html: |-
            <p>Zwar bin ich nach 20 Jahren auch beruflicher PC-Erfahrung kein heurig Häschen und habe auch die unterschiedlichsten Erfahrungen mit Systemadministratoren etc. gemacht, aber was hier und auf dieser Seite an do-it-yourself-Support angeboten wird, hat allererste Qualität.<br />
            Das betrifft die fachliche Seite ebenso wie die kommunikative Umsetzung, denn das ist die häufigste Schwäche nicht nur bei (angemaßten) Foren-Admins, sondern durchaus auch bei gestandenen und kompetenten Fachleuten &#8211; unter der Sachkompetenz leidet mitunter die Verständlichkeit für Otto-Normal-User. Das ist hier aber hervorragend gelöst. Großes Kompliment &#8211; ihr steht jetzt bei mir in den Favoriten!</p>
  - id: 608
    autor: "Rüdiger Leemann"
    datum: "13. Dezember 2016 um 20:06 Uhr"
    html: |-
            <p>Besten Dank für die ausführliche Erklärung der Installation. Eine Frage hätte ich dann aber doch. Wo liegt der Unterschied zu den auf mehreren Internetseiten angebotenen &#8222;Update-Packs&#8220; ( z.B. von Winfuture etc. ) ? Diese Packs sind, für 64 Bit  z.B.  auf schon fast 2 GB gewachsen, während hier das Pack nur ca. 400 MB groß ist!   ?   Könnten Sie mir das bitte kurz erklären ( ich will damit aber nicht Ihre Arbeit in Frage stellen! ).  Ansonsten aber eine tolle Arbeit, ich werde es die nächsten Tage gleich mal ausprobieren.</p>
  - id: 609
    autor: "Ralf Dyllick-Brenzinger"
    datum: "13. Dezember 2016 um 21:23 Uhr"
    html: |-
            <p>Sehr geehrter Herr Leemann, danke für die netten Worte. Der wichtigste formelle Unterschied zwischen dem in diesem Beitrag vorgestellten Convenience Rollup Pack und anderen Update-Packs ist die Urheberschaft. Das Rollup Pack kommt von Microsoft, also dem Hersteller selbst. Die Update Packs, wie sie von CHIP, Winfuture und anderen angeboten werden, kommen von diesen Parteien.<br />
            Der materielle Unterschied ist der Umfang der Packs. Das CHIP Windows 7 Update Pack z.B. hat den Anspruch &#8222;alle Updates in einem Paket&#8220; seit Erscheinen zu bündeln. Das Convenience Rollup Pack umfasst &#8222;nur&#8220; Betriebssystem-Updates, die zwischen Veröffentlichung des Service Pack 1 und seinem eigenen Erscheinungsdatum herausgegeben wurden. Und auch da scheint das Convenience Rollup Pack die eine oder andere Lücke zu haben.<br />
            Wir selbst verwenden intern nur das Rollup Pack, da es direkt von Microsoft kommt. Dass soll nicht bedeuten, dass die anderen schlecht oder nicht vertrauenswürdig sind, bei einem professionellen Anbieter ist die unfragwürdige Herkunft und Qualität von überragender Bedeutung.<br />
            Wir hoffen, dass wir Ihnen mit dieser Antwort helfen konnten.</p>
  - id: 821
    autor: "deno"
    datum: "26. Februar 2017 um 09:39 Uhr"
    html: |-
            <p>Eine dankbare und gute &#8222;Anleitung&#8220; für Windows 7 um an alle verfügbaren Updates für das manchmal doch noch benötigte Windows 7 schnell und ohne langes Suchen ranzukommen. Vielen Dank!</p>
  - id: 1574
    autor: "Norbert Sauer"
    datum: "18. Juli 2017 um 16:33 Uhr"
    html: |-
            <p>Hallo und Danke für den tollen Beitrag zur Windows 7 neuinstalation von SP 1 und vor allem zu SP2.<br />
            Ich steige jetzt aber nicht mehr durch.<br />
            SP 1 instaliert ok.<br />
            SP 2 ist instaliert ( bei wiedrholten versuchen es nocheinmal zu instalieren sagt der PC&#8220; ist bereits instaliert&#8220;<br />
            In der Systensteuerung-System und Sicherheit-System sagt der Rechner das nur SP 1 instaliert ist.<br />
            alle anderen KB sind ebensfalls instaliert.<br />
            Ich drehe bald durch<br />
            Über eine Hilfestellung wäre ich sehr Dankbar<br />
            Mit freundlichen Grüßen<br />
            Norbert</p>
  - id: 1575
    autor: "Ralf Dyllick-Brenzinger"
    datum: "18. Juli 2017 um 18:56 Uhr"
    html: |-
            <p>Hallo Norbert,</p>
            <p>es besteht kein Grund zum Durchdrehen, höchstens Bedarf für Aufklärung! Hier kommt Sie: Da das &#8222;Convenience Rollup for Windows 7 SP1&#8220; kein offizielles Service Pack ist, wird es als solches nicht in der Systemsteuerung angezeigt. D.h. der Verweis auf das Service Pack 1 in der Systemsteuerung und die Meldung &#8222;ist bereits installiert&#8220; ist kein Widerspruch!</p>
            <p>Lass einfach nochmal das Windows Update automatisch nach Updates suchen. Direkt nach dem Einspielen der Rollup Packs sollte das Windows Update nochmal einige Updates finden &#8211; wie im Artikel geschrieben. Statt hunderter KBs und mehrerer Neustartes ohne Rollup sollte es nur noch ein Klacks sein.</p>
            <p>Grüsse<br />
            ionas &#8211; Ihr Online Assistent</p>
