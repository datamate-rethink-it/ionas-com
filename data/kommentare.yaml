  - id: 2492
    autor: "Ralf Dyllick-Brenzinger"
    datum: "5. April 2018 um 19:37 Uhr"
    html: |-
            <p>Hallo Nicole,</p>
            <p>die Daten sind ja (hoffentlich) noch auf der Festplatte drauf, d.h. Du solltest ohne größere Probleme an die Daten kommen.</p>
            <p>Was Du tun musst, ist die alte Festplatte mit Deinem neuen Rechner zu verbinden. Am einfachsten ist das mit einem externen Laufwerksgehäuse. Bei einer kleinen 2.5Zoll Laptop-Festplatte gibt es das für €10 bei Conrad oder dem großen amerikanischen Versender mit A. Wenn Du einen waschechten PC hattest (also so einen großen Kasten), dann kosten die schon etwas mehr, weil die eine separate Stromversorgung benötigen. Wenn Du einen neuen PC hast (also wieder einen großen), dann könntest Du die alte Festplatte auch in das Gehäuse einbauen. Das erfordert aber ein wenig handwerkliches Geschick und ein bisschen Vorwissen.</p>
            <p>Wenn Du die alte Festplatte mit Deinem neuen Computer verbunden hast, dann sollte Dir die alte Festplatte als separates Laufwerk angezeigt werden. Klicke dort einfach drauf und suche nach der PST-Datei. Je nachdem welche Outlook Version Du im Einsatz hattest, ist das unterschiedlich.<br />
            * Bei Outlook 2007 und 2010 war das der Appdata Ordner: C:\users\username\AppData\Local\Microsoft\Outlook<br />
            * Seit Outlook 2013 ist der Speicherpfad der PST-Dateien wie folgt: C:\users\username\Documents\Outlook Files<br />
            (Wichtig: Bei Dir wird der Laufwerksbuchstabe der alten Festplatte nicht C: sein, denn diesen Laufwerksbuchstaben hat ja schon die Systempartition des Rechners.)</p>
            <p>Wenn Du die PST-Datei gefunden hast, dann kannst Du wie im Artikel beschrieben vorgehen. Wenn Du Hilfe benötigst, dann kannst Du uns natürlich auch anrufen: 06131 327070.</p>
            <p>Grüße<br />
            Ralf</p>
