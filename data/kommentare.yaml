  - id: 283
    autor: "Martina Obersberger"
    datum: "12. Mai 2016 um 21:33 Uhr"
    html: |-
            <p>Lieber Ralph,</p>
            <p>Danke für die super Erklärung!<br />
            Ich habe nun leider das Problem, dass ich jetzt zwar alle Mails in Outlook habe, jedoch alle Mails auf der GMX Browser Seite verschwunden sind!<br />
            Posteingang ist absolut leer!<br />
            Habe einen GMX Free Account.</p>
            <p>Der Fehler war, dass ich den Haken &#8222;Kopie auf Server belassen&#8220; (oder so ähnlich) vergessen habe.</p>
            <p>Wie bekomme ich die Mails jetzt wieder zurück?!</p>
            <p>Danke!!<br />
            Grüße Martina</p>
  - id: 284
    autor: "Ralf Dyllick-Brenzinger"
    datum: "13. Mai 2016 um 08:02 Uhr"
    html: |-
            <p>Hallo Martina,<br />
            nach Deiner Beschreibung gehe ich davon aus, dass Du die E-Mails von GMX per POP3-Protokoll herunter geladen hast. Kannst Du das in Deinen Outlook-Einstellungen prüfen? (Wo man das findet, findest Du im Abschnitt oben &#8218;Manuelle Konfiguration eines GMX-Kontos in Outlook&#8216;)</p>
            <p>Wenn dem so ist, dann ist die Lösung vergleichsweise einfach.</p>
            <p>1.) Stelle Outlook in Offline-Modus (Registerkarte Senden/Empfangen)<br />
            2.) Lege Dein GMX-Account nach dieser Anleitung erneut in Outlook an &#8211; diesmal aber als IMAP-Konto<br />
            3.) Erstelle in diesem IMAP-Konto die Ordner, die Du auch in Deinem POP3-Konto hast, d.h. repliziere die Verzeichnisstruktur des alten Kontos im neuen &#8211; wenn Du welche hast.<br />
            4.) Kopiere nun die E-Mails aus dem alten E-Mail Account in den neuen &#8211; Ordner für Ordner.<br />
            5.) Schalte dann Outlook wieder in den Online-Modus.<br />
            6.) Habe Geduld.</p>
            <p>Geduld musst Du nun haben, weil nun die E-Mails per IMAP wieder von lokal (d.h. Deinem Rechner) zum Server (d.h. der GMX-Mailserver) synchronisiert wird. Je nachdem wie viele E-Mails du hast und wie schnell Dein Upload ist, kann das lange dauern. Bei einem Kunden war das mal fast ein ganzer Tag. Den Fortschritt siehst du in der rechten unteren Ecke von Outlook.</p>
            <p>Was war das Problem: Du hast das POP3-Protokoll verwendet, um E-Mails vom Server abzurufen. POP3 ist ein Download-Protokoll, dass typischerweise nach dem Prinzip &#8222;Download-and-delete&#8220; arbeitet. Einmal runtergeladen, werden die Daten auf dem Server gelöscht. Die Daten liegen dann nur noch dort, wohin Du sie runter geladen hast.  Das IMAP-Protokoll ist der inoffizielle Nachfolger des POP3-Protokolls. Es ist kein Download-Protokoll, sondern ein Synchronisationsprotokoll. Es prüft, ob der Datenbestand lokal und auf dem Server identisch ist. Wenn nicht, dann werden Daten verschoben, bis auf beiden Geräten der gleiche Datenbestand verfügbar ist. Das geht in beide Richtungen &#8211; von Server zu Rechner und von Rechner zu Server. Letzteres machst Du Dir zu nutzen, um Deine Daten wieder auf den Server zu bekommen.</p>
            <p>Hoffe das kriegst Du hin. Ansonsten erreichst Du uns unter 06131 327070 &#8211; an 7 Tagen die Woche, von 8:00Uhr bis 20:00Uhr.</p>
